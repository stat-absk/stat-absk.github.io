# Checks on every push, run against the live site once GitHub Pages has
# deployed it: Lighthouse on Home, the CV and SingleBell against the budgets in
# UPGRADE-TRACKER.md, and a link check across the built site. A regression
# fails the run; the Lighthouse reports and screenshots at three widths in both
# appearances are kept as artefacts to look through.

name: checks

# Pages' own deploy is a "dynamic" workflow and does not raise workflow_run,
# but each deploy posts a deployment status; the checks start on success.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://stat-absk.github.io/
            https://stat-absk.github.io/cv.html
            https://stat-absk.github.io/singlebell.html
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  links:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir docs
            --accept 200,202,204,206,301,302,303,307,308,403,429,999
            --exclude-path docs/site_libs
            --exclude-path docs/slides
            --exclude 'linkedin\.com'
            'docs/**/*.html'
          fail: true

  # The live pages at 390, 768 and 1440 px in both appearances, kept as an
  # artefact to look through after each deploy (R/screenshots.R, chromote).
  screenshots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install chromote
        run: Rscript -e 'install.packages(c("chromote", "jsonlite"))'
      - name: Screenshots
        run: Rscript R/screenshots.R https://stat-absk.github.io screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30
