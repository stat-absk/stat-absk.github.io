<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    The site's marks: straight strokes drawn once, used everywhere something is
    counted, measured or begun. The chalk roughening is a page-level filter
    (#chalk, see _quarto.yml) applied by _marks.scss, so the same strokes serve
    the paper appearance clean and thinner. Every stroke takes currentColor.
    Hand-drawn marks can replace these symbols without any other change.
  -->
  <!-- One upright tally stroke. -->
  <symbol id="stroke" viewBox="0 0 12 40">
    <path d="M6.4 2.5 C5.7 12, 6.3 24, 5.5 37.5" fill="none" stroke="currentColor" stroke-linecap="round"/>
  </symbol>
  <!-- The fifth: a strike through the gate. -->
  <symbol id="strike" viewBox="0 0 60 40">
    <path d="M3 31 C18 24.5, 40 14, 57 7" fill="none" stroke="currentColor" stroke-linecap="round"/>
  </symbol>
  <!-- An underline, for marking a word. -->
  <symbol id="underline" viewBox="0 0 200 12" preserveAspectRatio="none">
    <path d="M3 7 C50 4, 100 9, 197 5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </symbol>
  <!-- A loose circle, for marking a point. -->
  <symbol id="circle" viewBox="0 0 120 60">
    <path d="M60 6 C95 5, 116 18, 114 32 C112 48, 80 56, 50 55 C22 54, 4 44, 6 30 C8 15, 36 6, 66 7" fill="none" stroke="currentColor" stroke-linecap="round"/>
  </symbol>
  <!-- The eight rules, each one unhurried stroke; neighbours never match. -->
  <symbol id="rule-1" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 6 C130 4.5, 260 8.5, 390 6.2 S650 3.8, 780 6.8 S930 5.5, 998 6" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-2" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 7 C110 8.5, 230 4, 350 6.5 S600 8, 720 5 S900 7.5, 998 5.5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-3" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 5 C150 7.5, 280 4.5, 420 6 S700 7.5, 830 4.5 S950 6, 998 6.5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-4" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 6.5 C90 4, 200 8, 330 5.5 S560 4.5, 690 7.5 S880 4, 998 6" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-5" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 5.5 C170 8, 300 5, 450 7 S640 4, 760 6.5 S920 8, 998 5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-6" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 7.5 C120 5, 250 7, 380 4.5 S610 7.5, 740 5.5 S900 4.5, 998 7" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-7" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 6 C200 3.5, 320 8, 470 6 S680 8.5, 800 5 S940 6.5, 998 5.5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
  <symbol id="rule-8" viewBox="0 0 1000 12" preserveAspectRatio="none"><path d="M2 5 C100 7, 240 4.5, 360 7.5 S590 5, 710 8 S890 6, 998 4.5" fill="none" stroke="currentColor" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
</svg>
