project:
  type: website
  output-dir: docs          # GitHub Pages serves from main branch / docs folder
  render:                   # pages are .qmd; the plan and tracker in Markdown are not pages
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - slides/               # self-contained slide decks, copied as-is
  post-render:
    - post-render.R         # recreates docs/.nojekyll after each build

website:
  title: "Abhishek Bhattacharjee"
  description: "Biostatistics leader — clinical development strategy, regulatory science, and real-world evidence."
  site-url: "https://stat-absk.github.io"
  favicon: images/favicon.png
  open-graph: true
  twitter-card: true

  navbar:
    logo: images/favicon.svg
    title: "Abhishek Bhattacharjee"
    left:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
      - href: stuff.qmd
        text: Stuff
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/stat-absk/
        aria-label: LinkedIn
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=9LJsXtMAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/stat-absk
        aria-label: GitHub

  page-footer:
    left: "&copy; 2026 Abhishek Bhattacharjee"
    center:
      - text: "Home"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Stuff"
        href: stuff.qmd
      - text: "Workbench"
        href: workbench.qmd
      - text: "SingleBell"
        href: singlebell.qmd
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark:  [default, styles-dark.scss]    # SingleBell's material; the default
      light: [default, styles-light.scss]   # the same material, read the other way
    respect-user-color-scheme: true          # the reader's setting wins; the toggle overrides
    canonical-url: true
    page-layout: full                        # the page takes the viewport, as the decks do
    grid:
      sidebar-width: 0px
      body-width: 1600px
      margin-width: 240px
      gutter-width: 2.5rem
    toc: true
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: false           # links stay in the tab; the reader decides
    include-in-header:
      - text: |
          <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
          <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
          <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1412">
          <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F3EA">
    include-before-body:
      - text: |
          <a class="skip-link" href="#quarto-document-content">Skip to content</a>
    include-after-body:
      - text: |
          <script>
            // Scroll edge: the header wears its glass only once content passes under it.
            (function () {
              // "Skip to content" must be the first thing a keyboard reaches. Quarto
              // places include-before-body inside main, so it is moved to the body's top.
              var skip = document.querySelector(".skip-link");
              if (skip) document.body.prepend(skip);
              var header = document.getElementById("quarto-header");
              if (!header) return;
              var hero = document.querySelector(".hero-name");
              if (hero) header.classList.add("has-hero");
              var update = function () {
                header.classList.toggle("scrolled", window.scrollY > 8);
                if (hero) {
                  header.classList.toggle("past-hero", hero.getBoundingClientRect().bottom < 64);
                }
              };
              window.addEventListener("scroll", update, { passive: true });
              update();
            })();
          </script>

execute:
  freeze: auto      # don't re-run R code unless the .qmd actually changed
  warning: false
  message: false

editor: source
